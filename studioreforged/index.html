<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Reforged — Coming Soon</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #f0f0f0;
    overflow: hidden;
  }

  .video-bg {
    position: fixed;
    inset: 0;
    z-index: -2;
  }

  .video-bg video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: rgba(0, 0, 0, 0.55);
  }

  .container {
    max-width: 560px;
    position: relative;
  }

  .badge {
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #c8f135;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 24px;
    backdrop-filter: blur(8px);
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    line-height: 1.1;
    margin-bottom: 16px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }

  h1 span {
    color: #c8f135;
  }

  p {
    color: rgba(255,255,255,0.7);
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 32px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }

  .contact {
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius: 12px;
    padding: 20px 24px;
    display: inline-block;
  }

  .contact a {
    color: #c8f135;
    text-decoration: none;
    font-weight: 600;
  }

  .contact a:hover {
    text-decoration: underline;
  }

  footer {
    margin-top: 40px;
    color: rgba(255,255,255,0.4);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="video-bg">
    <video autoplay loop muted playsinline>
      <source src="bg.mp4" type="video/mp4">
    </video>
  </div>
  <div class="overlay"></div>

  <div class="container">
    <div class="badge">In Development</div>
    <h1>Studio Reforged is <span>being built</span>.</h1>
    <p>We're currently working on something new. Check back soon — in the meantime, feel free to reach out.</p>
    <div class="contact">
      <a href="mailto:hello@studioreforged.com">hello@studioreforged.com</a>
    </div>
    <div class="contact" style="margin-top: 16px;">
      <a href="/remenhancer">Try REMEnhancer, our free photo resolution enhancer →</a>
    </div>
    <footer>&copy; 2026 Studio Reforged. All rights reserved.</footer>
  </div>
</body>
</html>
